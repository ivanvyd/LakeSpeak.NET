name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.0). Leave blank for a dev build.'
        type: string
        required: false
      publish:
        description: 'Publish to NuGet. Leave unticked to build, test and attest without releasing.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building $v"

      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --no-build -c Release --filter "Category!=Live"

      - name: Pack
        run: dotnet pack --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # Self-contained binaries for people who do not have the .NET SDK. macOS
      # is built but is listed as untested in the compatibility matrix until
      # someone has actually run it on a Mac.
      - name: Publish binaries
        run: |
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/LakeSpeak.Cli/LakeSpeak.Cli.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:PublishSingleFile=true \
              -o "publish/$rid"
            ( cd "publish/$rid" && zip -qr "../../artifacts/lakespeak-${{ steps.version.outputs.version }}-$rid.zip" . )
          done

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # An SBOM is the vendor list an adopter's SOC 2 vendor-risk review asks
      # for. Generated from the restored graph, not hand-maintained.
      - name: SBOM
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX LakeSpeak.slnx -o artifacts --json --filename sbom.json

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: 'artifacts/*.nupkg'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/

  publish:
    needs: build
    # A tag push publishes. A manual run publishes only when explicitly ticked, so the default
    # dispatch is a safe rehearsal that builds, tests and attests without releasing anything.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    # A protected environment turns publishing into a decision someone makes,
    # rather than a side effect of pushing a tag.
    environment: nuget
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not configured; refusing to publish."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Only a tag has a release to attach artifacts to; a manual publish has no ref to name.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/sbom.json
          generate_release_notes: true
