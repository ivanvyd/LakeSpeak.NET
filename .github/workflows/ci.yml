name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Jobs needing more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # --locked-mode makes packages.lock.json authoritative: a transitive
      # version that drifted since review fails here instead of shipping.
      # Named, so the failure can say what to do about it. NU1004 on a Dependabot branch means
      # the lock files were not regenerated, which is a chore rather than a defect -- and the
      # error NuGet prints for it does not mention the fix.
      - name: Restore
        run: |
          set -euo pipefail
          if ! dotnet restore --locked-mode; then
            echo "::error title=Lock files are out of step::dotnet restore --locked-mode failed. If this is a dependency bump, Dependabot cannot rewrite packages.lock.json under central package management. Run the 'Refresh lock files' workflow against ${{ github.head_ref || github.ref_name }}, then re-run these checks."
            exit 1
          fi
      - run: dotnet build --no-restore -c Release

      # Formatting is enforced in-build by EnforceCodeStyleInBuild; this catches
      # whitespace-only drift the analyzers do not see.
      - run: dotnet format --verify-no-changes --no-restore

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q -E '>\s+\S+\s+\S+\s+\S+\s+(Moderate|High|Critical)' vuln.txt && exit 1
          echo "no moderate-or-higher advisories"

      # A tool package that does not install is a broken release, and the failure
      # only appears at `dotnet tool install` time unless it is checked here.
      - name: Pack
        run: dotnet pack --no-build -c Release -o artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/*.nupkg

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI reads terminal width, honours NO_COLOR and shells out to the
        # Databricks CLI. All three behave differently on Windows, so a
        # Linux-only matrix would not cover the primary maintainer's own platform.
        # macOS is added because a tool that is only ever tested on Windows and
        # Linux can quietly depend on case-insensitive file paths or LF line
        # endings; running the suite on a third platform catches that class of
        # defect before users do.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode

      # Live tests need a real workspace and real credentials. They are excluded
      # here by trait rather than omitted from the solution, so they still compile.
      # MTP mode is enabled by global.json's `test.runner: Microsoft.Testing.Platform`;
      # xunit v3's MTP filter is `--filter-not-trait "Category=Live"` (no `!=` syntax,
      # and `--filter-trait` matches positively — different from VSTest's `--filter`),
      # and `--logger trx` is now `--report-trx` (writes a TRX file into `--output`).
      # `--ignore-exit-code 8` suppresses MTP's "zero tests in a project" exit; the
      # LiveIntegrationTests project has 0 matching tests in this run, which would
      # otherwise set the overall exit code to 8.
      - run: dotnet test --no-restore -c Release --filter-not-trait "Category=Live" --report-trx --output TestResults --ignore-exit-code 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

  # The install path users actually take. Packing proves the package builds;
  # this proves it installs and the entry point runs.
  tool-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts
      - name: Install and run
        run: |
          dotnet tool install --global --add-source ./artifacts LakeSpeak.Cli \
            --version "$(ls artifacts/LakeSpeak.Cli.*.nupkg | sed -E 's/.*LakeSpeak\.Cli\.(.*)\.nupkg/\1/')"
          export PATH="$PATH:$HOME/.dotnet/tools"
          lakespeak --version
