name: Live smoke (Databricks Genie)

# Exercises the real Databricks Genie Conversation API against a live workspace, using a
# dedicated service-principal credential stored in this repository. The suite is opt-in: a fork
# without the variables sees a notice and exits cleanly, so a contributor's PR can still be
# reviewed. The maintainer runs the job from `Actions` on demand and a weekly schedule keeps the
# live path from rotting between uses.
#
# `docs/compatibility.md` records what this job has actually run against. The job is not a
# gate; failures here do not block a PR. A live failure is a signal to update the compat
# table and the live test, not to revert a code change that passes the contract suite.

on:
  workflow_dispatch:
  schedule:
    # Once a week is enough to catch a Databricks-side change in wire shape or auth flow
    # before it surprises a release. Earlier in the week gives a few days to investigate
    # before anyone cites the failure.
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    # The job is gated on non-secret configuration. OAuth credentials are checked at the step
    # level because `secrets.*` is not allowed in workflow-level `if:` expressions. The
    # not-configured job covers the host/Agent case; the credential check gives a clear error for
    # an incomplete M2M setup.
    if: ${{ vars.LAKESPEAK_LIVE_HOST != '' && vars.LAKESPEAK_LIVE_AGENT != '' }}
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # Keeping the host out of secrets makes the configuration inspectable in PR review and
      # means moving the workspace does not require rotating the OAuth credential.
      DATABRICKS_HOST: ${{ vars.LAKESPEAK_LIVE_HOST }}
      LAKESPEAK_LIVE_AGENT: ${{ vars.LAKESPEAK_LIVE_AGENT }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fail early if OAuth M2M is not configured
        if: ${{ env.DATABRICKS_CLIENT_ID == '' || env.DATABRICKS_CLIENT_SECRET == '' }}
        run: |
          echo "::error::secrets.DATABRICKS_CLIENT_ID and secrets.DATABRICKS_CLIENT_SECRET must both be set. See docs/authentication.md and docs/compatibility.md."
          exit 1
      - run: dotnet restore --locked-mode
      # Pin to net10.0 — the net8.0 cell is the CI matrix's job.
      - run: dotnet test --no-restore -c Release -f net10.0 --filter-trait 'Category=Live' --results-directory TestResults --ignore-exit-code 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-test-results
          path: TestResults/

  not-configured:
    # A separate job for the "not configured" case so the run shows a clear status and the
    # maintainer can tell at a glance which configuration they have.
    if: ${{ vars.LAKESPEAK_LIVE_HOST == '' || vars.LAKESPEAK_LIVE_AGENT == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skipped — variables not configured
        run: |
          echo "::notice title=Live smoke skipped::Set vars.LAKESPEAK_LIVE_HOST and vars.LAKESPEAK_LIVE_AGENT, and secrets.DATABRICKS_CLIENT_ID and secrets.DATABRICKS_CLIENT_SECRET, to run the live suite. See docs/authentication.md and docs/compatibility.md."
