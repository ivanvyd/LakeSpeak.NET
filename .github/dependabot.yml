version: 2

updates:
  # NOTE: Dependabot updates Directory.Packages.props but cannot rewrite packages.lock.json --
  # the CentralTransitive entries have to be resolved by NuGet, not pattern-matched. Every bump
  # here therefore arrives with stale lock files and fails `dotnet restore --locked-mode` (NU1004)
  # until they are regenerated. Run the "Refresh lock files" workflow against the bump's branch;
  # .github/workflows/refresh-lock-files.yml explains why that is a button and not automatic.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Verify 33.x requires an entitlement declaration. Revisit this when the
    # maintainer has a verified sponsorship, license, or qualifying exemption.
    ignore:
      - dependency-name: Verify.XunitV3
        update-types: ['version-update:semver-major']
      # Each Microsoft.Extensions major is a .NET release line, and ADR 0006 keeps net10.0 on
      # the 10.x servicing line (net8.0 on 8.0.x). Moving to 11.x is a target-framework
      # decision, not routine maintenance, and the family has to move together.
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per ecosystem-wide bump rather than a dozen. The Microsoft.Extensions
      # packages move in lockstep and reviewing them separately finds nothing.
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']
      test:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet*', 'Shouldly', 'NSubstitute', 'Verify*', 'WireMock*']

  # Actions are SHA-pinned, so without this they never move and the pins rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Every github/codeql-action/* step has to move together. CodeQL refuses to run
      # when init, autobuild, analyze and upload-sarif are not all on the same version
      # -- "Loaded a configuration file for version X, but running version Y" -- so an
      # ungrouped bump opens one PR per sub-action, each of which fails on its own and
      # can only pass alongside the others. Grouped by pattern rather than update-type,
      # because that constraint holds for a major just as much as a patch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dockerfiles use immutable manifest digests, so Dependabot keeps the pinned base images current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
