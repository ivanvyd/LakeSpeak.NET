version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem-wide bump rather than a dozen. The Microsoft.Extensions
      # packages move in lockstep and reviewing them separately finds nothing.
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']
      test:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet*', 'Shouldly', 'NSubstitute', 'Verify*', 'WireMock*']

  # Actions are SHA-pinned, so without this they never move and the pins rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Every github/codeql-action/* step has to move together. CodeQL refuses to run
      # when init, autobuild, analyze and upload-sarif are not all on the same version
      # -- "Loaded a configuration file for version X, but running version Y" -- so an
      # ungrouped bump opens one PR per sub-action, each of which fails on its own and
      # can only pass alongside the others. Grouped by pattern rather than update-type,
      # because that constraint holds for a major just as much as a patch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - minor
          - patch
