<svg xmlns="http://www.w3.org/2000/svg" width="791" height="506" viewBox="0 0 791 506" role="img" aria-label="lakespeak ask --agent sales --show-sql &quot;What is the total revenue by region?&quot;">
  <title>lakespeak ask --agent sales --show-sql &quot;What is the total revenue by region?&quot;</title>
  <rect x="0" y="0" width="791" height="506" rx="10" fill="#11151c"/>
  <path d="M0 10a10 10 0 0 1 10-10h771a10 10 0 0 1 10 10v30H0z" fill="#1b212b"/>
  <circle cx="22" cy="20" r="5.5" fill="#e06a5f"/><circle cx="40" cy="20" r="5.5" fill="#e0b341"/><circle cx="58" cy="20" r="5.5" fill="#5ec27a"/>
  <text x="395.5" y="25" fill="#7c8899" font-size="12.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',Consolas,monospace">lakespeak ask --agent sales --show-sql &quot;What is the total revenue by region?&quot;</text>
  <g font-family="ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',Consolas,monospace" font-size="13.5">
    <text x="22" y="46" fill="#7c8899" xml:space="preserve">Genie is analyzing your question…</text>
    <text x="22" y="66" fill="#7c8899" xml:space="preserve">Waiting for a SQL warehouse…</text>
    <text x="22" y="86" fill="#7c8899" xml:space="preserve">Preparing answer…</text>
    <text x="22" y="106" fill="#c8d3e0" xml:space="preserve">The total revenue by region is as follows:</text>
    <text x="22" y="126" fill="#c8d3e0" xml:space="preserve">- **Germany:** €4,500,000.00</text>
    <text x="22" y="146" fill="#c8d3e0" xml:space="preserve">- **France:** €3,350,000.50</text>
    <text x="22" y="166" fill="#c8d3e0" xml:space="preserve">- **Spain:** €1,780,000.25</text>
    <text x="22" y="186" fill="#c8d3e0" xml:space="preserve">Germany generated the highest revenue among the listed regions.</text>
    <text x="22" y="226" fill="#2a3240" xml:space="preserve">╭────────────────────────┬─────────────────────────────────────────────────────╮</text>
    <text x="22" y="246"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> region                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> total_revenue_eur                                   </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="266" fill="#2a3240" xml:space="preserve">├────────────────────────┼─────────────────────────────────────────────────────┤</text>
    <text x="22" y="286"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Germany                </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 4500000.00                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="306"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> France                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 3350000.50                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="326"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Spain                  </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 1780000.25                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="346" fill="#2a3240" xml:space="preserve">╰────────────────────────┴─────────────────────────────────────────────────────╯</text>
    <text x="22" y="366" fill="#56b6c2" xml:space="preserve">╭─Generated SQL─────────────────────────────────────────────╮</text>
    <text x="22" y="386"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> SELECT `region`, SUM(`revenue_eur`) AS total_revenue_eur  </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="406"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> FROM `sales`.`public`.`regional_revenue`                  </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="426"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> WHERE `region` IS NOT NULL AND `revenue_eur` IS NOT NULL  </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="446"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> GROUP BY `region`                                         </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="466" fill="#2a3240" xml:space="preserve">╰───────────────────────────────────────────────────────────╯</text>
  </g>
</svg>
