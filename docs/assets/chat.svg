<svg xmlns="http://www.w3.org/2000/svg" width="716" height="1226" viewBox="0 0 716 1226" role="img" aria-label="lakespeak chat --agent sales">
  <title>lakespeak chat --agent sales</title>
  <rect x="0" y="0" width="716" height="1226" rx="10" fill="#11151c"/>
  <path d="M0 10a10 10 0 0 1 10-10h696a10 10 0 0 1 10 10v30H0z" fill="#1b212b"/>
  <circle cx="22" cy="20" r="5.5" fill="#e06a5f"/><circle cx="40" cy="20" r="5.5" fill="#e0b341"/><circle cx="58" cy="20" r="5.5" fill="#5ec27a"/>
  <text x="358.0" y="25" fill="#7c8899" font-size="12.5" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',Consolas,monospace">lakespeak chat --agent sales</text>
  <g font-family="ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',Consolas,monospace" font-size="13.5">
    <text x="22" y="46" fill="#c8d3e0" xml:space="preserve">LakeSpeak.NET — independent, not a Databricks product</text>
    <text x="22" y="66" fill="#c8d3e0" xml:space="preserve">Agent: Sales Intelligence</text>
    <text x="22" y="86" fill="#c8d3e0" xml:space="preserve">Type /help for commands, /exit to leave.</text>
    <text x="22" y="126"><tspan fill="#5ec27a" xml:space="preserve">You:</tspan><tspan fill="#c8d3e0" xml:space="preserve"> What is the total revenue by region?</tspan></text>
    <text x="22" y="146" fill="#7c8899" xml:space="preserve">Genie is analyzing your question…</text>
    <text x="22" y="166" fill="#7c8899" xml:space="preserve">Waiting for a SQL warehouse…</text>
    <text x="22" y="186" fill="#7c8899" xml:space="preserve">Preparing answer…</text>
    <text x="22" y="226" fill="#c8d3e0" xml:space="preserve">The total revenue by region is as follows: **Germany** generated €4,500,000.00,</text>
    <text x="22" y="246" fill="#c8d3e0" xml:space="preserve">**France** generated €3,350,000.50, and **Spain** generated €1,780,000.25. Among</text>
    <text x="22" y="266" fill="#c8d3e0" xml:space="preserve">these regions, Germany had the highest total revenue, while Spain had the</text>
    <text x="22" y="286" fill="#c8d3e0" xml:space="preserve">lowest.</text>
    <text x="22" y="326" fill="#2a3240" xml:space="preserve">╭────────────────────────┬─────────────────────────────────────────────────────╮</text>
    <text x="22" y="346"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> region                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> total_revenue_eur                                   </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="366" fill="#2a3240" xml:space="preserve">├────────────────────────┼─────────────────────────────────────────────────────┤</text>
    <text x="22" y="386"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Germany                </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 4500000.00                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="406"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> France                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 3350000.50                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="426"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Spain                  </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 1780000.25                                          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="446" fill="#2a3240" xml:space="preserve">╰────────────────────────┴─────────────────────────────────────────────────────╯</text>
    <text x="22" y="466" fill="#c8d3e0" xml:space="preserve">/sql  /result  /export</text>
    <text x="22" y="506"><tspan fill="#5ec27a" xml:space="preserve">You:</tspan><tspan fill="#c8d3e0" xml:space="preserve">  and break that down by quarter</tspan></text>
    <text x="22" y="526" fill="#7c8899" xml:space="preserve">Genie is analyzing your question…</text>
    <text x="22" y="546" fill="#7c8899" xml:space="preserve">Waiting for a SQL warehouse…</text>
    <text x="22" y="566" fill="#7c8899" xml:space="preserve">Genie is analyzing your question…</text>
    <text x="22" y="586" fill="#7c8899" xml:space="preserve">Preparing answer…</text>
    <text x="22" y="626" fill="#c8d3e0" xml:space="preserve">The total revenue by region is broken down by quarter as follows:</text>
    <text x="22" y="646" fill="#c8d3e0" xml:space="preserve">- **France**: €1,650,000.00 in 2025-Q4 and €1,700,000.50 in 2026-Q1</text>
    <text x="22" y="666" fill="#c8d3e0" xml:space="preserve">- **Germany**: €2,100,000.00 in 2025-Q4 and €2,400,000.00 in 2026-Q1</text>
    <text x="22" y="686" fill="#c8d3e0" xml:space="preserve">- **Spain**: €880,000.00 in 2025-Q4 and €900,000.25 in 2026-Q1</text>
    <text x="22" y="706" fill="#c8d3e0" xml:space="preserve">Revenue increased from Q4 2025 to Q1 2026 in all regions, with Germany showing</text>
    <text x="22" y="726" fill="#c8d3e0" xml:space="preserve">the largest growth.</text>
    <text x="22" y="766" fill="#2a3240" xml:space="preserve">╭────────────────────┬──────────────────┬──────────────────────────────────────╮</text>
    <text x="22" y="786"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> region             </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> quarter          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> total_revenue_eur                    </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="806" fill="#2a3240" xml:space="preserve">├────────────────────┼──────────────────┼──────────────────────────────────────┤</text>
    <text x="22" y="826"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> France             </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2025-Q4          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 1650000.00                           </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="846"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> France             </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2026-Q1          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 1700000.50                           </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="866"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Germany            </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2025-Q4          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2100000.00                           </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="886"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Germany            </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2026-Q1          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2400000.00                           </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="906"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Spain              </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2025-Q4          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 880000.00                            </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="926"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> Spain              </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 2026-Q1          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> 900000.25                            </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="946" fill="#2a3240" xml:space="preserve">╰────────────────────┴──────────────────┴──────────────────────────────────────╯</text>
    <text x="22" y="966" fill="#c8d3e0" xml:space="preserve">/sql  /result  /export</text>
    <text x="22" y="1006"><tspan fill="#5ec27a" xml:space="preserve">You:</tspan><tspan fill="#c8d3e0" xml:space="preserve"> /sql</tspan></text>
    <text x="22" y="1026" fill="#56b6c2" xml:space="preserve">╭─Generated SQL────────────────────────────────────────────────────────────────╮</text>
    <text x="22" y="1046"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> SELECT `region`, `quarter`, SUM(`revenue_eur`) AS total_revenue_eur          </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1066"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> FROM `sales`.`public`.`regional_revenue`                                     </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1086"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> WHERE `region` IS NOT NULL AND `quarter` IS NOT NULL                         </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1106"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve">   AND `revenue_eur` IS NOT NULL                                              </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1126"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> GROUP BY `region`, `quarter`                                                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1146"><tspan fill="#2a3240" xml:space="preserve">│</tspan><tspan fill="#c8d3e0" xml:space="preserve"> ORDER BY `region`, `quarter`                                                 </tspan><tspan fill="#2a3240" xml:space="preserve">│</tspan></text>
    <text x="22" y="1166" fill="#2a3240" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────╯</text>
    <text x="22" y="1186"><tspan fill="#5ec27a" xml:space="preserve">You:</tspan><tspan fill="#c8d3e0" xml:space="preserve"> /exit</tspan></text>
  </g>
</svg>
